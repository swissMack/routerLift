<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1080" width="1560" height="1080" font-family="Helvetica, Arial, sans-serif">
<style>
  .bg{fill:#fbfbf9}
  .chip{fill:#2b2b2b;stroke:#111;stroke-width:2;rx:8}
  .chiptxt{fill:#fff;font-size:15px;font-weight:700}
  .chipsub{fill:#bbb;font-size:11px}
  .pinbox{stroke:#333;stroke-width:1.2;rx:3}
  .pn{font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;fill:#111}
  .fn{font-size:11.5px;fill:#111}
  .lead{stroke:#666;stroke-width:1.2}
  .ttl{font-size:20px;font-weight:700;fill:#111}
  .hdr{font-size:15px;font-weight:700;fill:#111}
  .sub{font-size:11px;fill:#666}
  .tiny{font-size:10.5px;fill:#777}
  .note{font-size:11px;fill:#444}
  .warn{font-size:11.5px;fill:#b3261e;font-weight:700}
  .ok{font-size:11.5px;fill:#166534;font-weight:700}
  .box{fill:#fff;stroke:#333;stroke-width:1.6;rx:6}
</style>
<rect class="bg" x="0" y="0" width="1560" height="1080"/>
<text x="40" y="40" class="ttl">routerLift — Pin Assignment, Rev H</text>
<text x="40" y="60" class="sub">Two controllers. Colour indicates function class; grey pins are committed by the board and unavailable.</text>

<!-- legend -->
<g transform="translate(980,26)">
  <rect x="0" y="0" width="16" height="12" fill="#dbeafe" stroke="#333" stroke-width="1"/><text x="22" y="10" class="tiny">output</text>
  <rect x="90" y="0" width="16" height="12" fill="#dcfce7" stroke="#333" stroke-width="1"/><text x="112" y="10" class="tiny">input</text>
  <rect x="170" y="0" width="16" height="12" fill="#fef3c7" stroke="#333" stroke-width="1"/><text x="192" y="10" class="tiny">comms</text>
  <rect x="260" y="0" width="16" height="12" fill="#fee2e2" stroke="#333" stroke-width="1"/><text x="282" y="10" class="tiny">power</text>
  <rect x="340" y="0" width="16" height="12" fill="#ede9fe" stroke="#333" stroke-width="1"/><text x="362" y="10" class="tiny">reserved</text>
  <rect x="440" y="0" width="16" height="12" fill="#e5e7eb" stroke="#333" stroke-width="1"/><text x="462" y="10" class="tiny">committed / unavailable</text>
</g>

<!-- ==================== FLUIDNC ESP32 ==================== -->
<text x="40" y="106" class="hdr">1 · MOTION CONTROLLER — ESP32 (classic), stock FluidNC</text>
<text x="40" y="122" class="sub">All assignments set in config.yaml. ~9 GPIOs remain free.</text>

<rect class="chip" x="430" y="150" width="230" height="500"/>
<text x="452" y="182" class="chiptxt">ESP32</text>
<text x="452" y="200" class="chipsub">devkit · 3.3 V logic</text>
<text x="452" y="228" class="chipsub">FluidNC</text>
<text x="452" y="244" class="chipsub">config.yaml</text>
<text x="452" y="600" class="chipsub">FluidNC does NOT</text>
<text x="452" y="616" class="chipsub">run on ESP32-S3 —</text>
<text x="452" y="632" class="chipsub">hence two boards</text>

<!-- LEFT PINS (outputs) -->
<g>
  <rect class="pinbox" x="250" y="182" width="60" height="22" fill="#fee2e2"/><text x="258" y="198" class="pn">5V</text>
  <line class="lead" x1="310" y1="193" x2="430" y2="193"/><text x="120" y="198" class="fn" text-anchor="end">+5 V in</text>
  <text x="130" y="198" class="fn">←</text>

  <rect class="pinbox" x="250" y="214" width="60" height="22" fill="#fee2e2"/><text x="258" y="230" class="pn">GND</text>
  <line class="lead" x1="310" y1="225" x2="430" y2="225"/><text x="120" y="230" class="fn" text-anchor="end">0 V</text>

  <rect class="pinbox" x="250" y="260" width="60" height="22" fill="#dbeafe"/><text x="258" y="276" class="pn">G26</text>
  <line class="lead" x1="310" y1="271" x2="430" y2="271"/><text x="240" y="276" class="fn" text-anchor="end">STEP → TB6600 PUL−</text>

  <rect class="pinbox" x="250" y="292" width="60" height="22" fill="#dbeafe"/><text x="258" y="308" class="pn">G27</text>
  <line class="lead" x1="310" y1="303" x2="430" y2="303"/><text x="240" y="308" class="fn" text-anchor="end">DIR → TB6600 DIR−</text>

  <rect class="pinbox" x="250" y="324" width="60" height="22" fill="#dbeafe"/><text x="258" y="340" class="pn">G14</text>
  <line class="lead" x1="310" y1="335" x2="430" y2="335"/><text x="240" y="340" class="fn" text-anchor="end">ENA → TB6600 ENA−</text>

  <rect class="pinbox" x="250" y="356" width="60" height="22" fill="#dbeafe"/><text x="258" y="372" class="pn">G04</text>
  <line class="lead" x1="310" y1="367" x2="430" y2="367"/><text x="240" y="372" class="fn" text-anchor="end">RELAY → router contactor</text>

  <rect class="pinbox" x="250" y="402" width="60" height="22" fill="#fef3c7"/><text x="258" y="418" class="pn">G17</text>
  <line class="lead" x1="310" y1="413" x2="430" y2="413"/><text x="240" y="418" class="fn" text-anchor="end">UART TX → HMI G17</text>

  <rect class="pinbox" x="250" y="434" width="60" height="22" fill="#fef3c7"/><text x="258" y="450" class="pn">G16</text>
  <line class="lead" x1="310" y1="445" x2="430" y2="445"/><text x="240" y="450" class="fn" text-anchor="end">UART RX ← HMI G18</text>

  <rect class="pinbox" x="250" y="490" width="60" height="22" fill="#ede9fe"/><text x="258" y="506" class="pn">G34</text>
  <line class="lead" x1="310" y1="501" x2="430" y2="501"/><text x="240" y="506" class="fn" text-anchor="end">reserved — feedback</text>

  <rect class="pinbox" x="250" y="522" width="60" height="22" fill="#ede9fe"/><text x="258" y="538" class="pn">G35</text>
  <line class="lead" x1="310" y1="533" x2="430" y2="533"/><text x="240" y="538" class="fn" text-anchor="end">DRIVER_ALARM (DEV-01)</text>
</g>

<!-- RIGHT PINS (inputs) -->
<g>
  <rect class="pinbox" x="780" y="260" width="60" height="22" fill="#dcfce7"/><text x="788" y="276" class="pn">G33</text>
  <line class="lead" x1="660" y1="271" x2="780" y2="271"/><text x="850" y="276" class="fn">HOME — bottom limit + machine zero</text>

  <rect class="pinbox" x="780" y="292" width="60" height="22" fill="#dcfce7"/><text x="788" y="308" class="pn">G25</text>
  <line class="lead" x1="660" y1="303" x2="780" y2="303"/><text x="850" y="308" class="fn">TOP — positive limit</text>

  <rect class="pinbox" x="780" y="324" width="60" height="22" fill="#dcfce7"/><text x="788" y="340" class="pn">G32</text>
  <line class="lead" x1="660" y1="335" x2="780" y2="335"/><text x="850" y="340" class="fn">PROBE — touch-off plate</text>

  <rect class="pinbox" x="780" y="356" width="60" height="22" fill="#dcfce7"/><text x="788" y="372" class="pn">G13</text>
  <line class="lead" x1="660" y1="367" x2="780" y2="367"/><text x="850" y="372" class="fn">FOOT SWITCH — <tspan font-family="ui-monospace,Menlo,monospace">macro0_pin</tspan></text>

  <rect class="pinbox" x="780" y="388" width="60" height="22" fill="#dcfce7"/><text x="788" y="404" class="pn">G21</text>
  <line class="lead" x1="660" y1="399" x2="780" y2="399"/><text x="850" y="404" class="fn">STOP — <tspan font-family="ui-monospace,Menlo,monospace">feed_hold_pin</tspan></text>
  <text x="850" y="420" class="ok">acts with no HMI involvement</text>

  <rect class="pinbox" x="780" y="450" width="60" height="22" fill="#fff"/><text x="788" y="466" class="pn">free</text>
  <line class="lead" x1="660" y1="461" x2="780" y2="461"/><text x="850" y="466" class="fn">G22 · G05 · G18 · G19 · G23 · G02 · G15 · G12</text>
  <text x="850" y="482" class="tiny">~8 spare. Note G12 is a boot strap; G02 and G15 too.</text>
</g>

<!-- FluidNC notes -->
<rect class="box" x="40" y="672" width="1480" height="118"/>
<text x="56" y="694" class="hdr">Cautions — motion board</text>
<text x="56" y="716" class="warn">TB6600 common anode goes to +3.3 V, not +5 V.</text>
<text x="380" y="716" class="note">At 5 V the ESP32's logic high leaves 1.7 V across the input opto — above its LED drop — so it never fully turns off.</text>
<text x="56" y="736" class="note">Presents as missed steps at rapid, which under DEV-01 is silent depth error.</text>
<text x="56" y="758" class="warn">G34–G39 have NO internal pull-ups.</text>
<text x="380" y="758" class="note">That is why the foot switch is on G13 and not on the pins freed by moving the MPG. Do not reassign a limit onto 34–39.</text>
<text x="56" y="778" class="note">All five sensor inputs pass the common conditioning circuit — 10 k series, 4k7 pull-up to 3V3, BAT54S clamp, 100 nF. ELE-04 met in hardware.</text>

<!-- ==================== HMI ESP32-S3 ==================== -->
<text x="40" y="836" class="hdr">2 · OPERATOR PANEL — ESP32-S3 on the ESP32-4827S043 board</text>
<text x="40" y="852" class="sub">The RGB parallel panel commits 20 GPIOs. Only three remain free, so panel buttons go on an I²C expander.</text>

<rect class="chip" x="430" y="876" width="230" height="176"/>
<text x="452" y="906" class="chiptxt">ESP32-S3</text>
<text x="452" y="924" class="chipsub">WROOM-1-N4R8</text>
<text x="452" y="948" class="chipsub">4 MB flash</text>
<text x="452" y="964" class="chipsub">8 MB octal PSRAM</text>
<text x="452" y="992" class="chipsub">LVGL 8.4</text>
<text x="452" y="1008" class="chipsub">Arduino_GFX</text>
<text x="452" y="1036" class="chipsub">our firmware</text>

<g>
  <rect class="pinbox" x="250" y="898" width="60" height="22" fill="#fef3c7"/><text x="258" y="914" class="pn">G18</text>
  <line class="lead" x1="310" y1="909" x2="430" y2="909"/><text x="240" y="914" class="fn" text-anchor="end">UART TX → FluidNC G16</text>

  <rect class="pinbox" x="250" y="930" width="60" height="22" fill="#fef3c7"/><text x="258" y="946" class="pn">G17</text>
  <line class="lead" x1="310" y1="941" x2="430" y2="941"/><text x="240" y="946" class="fn" text-anchor="end">UART RX ← FluidNC G17</text>

  <rect class="pinbox" x="250" y="976" width="60" height="22" fill="#dcfce7"/><text x="258" y="992" class="pn">G11</text>
  <line class="lead" x1="310" y1="987" x2="430" y2="987"/><text x="240" y="992" class="fn" text-anchor="end">MPG A ← 74HCT14</text>

  <rect class="pinbox" x="250" y="1008" width="60" height="22" fill="#dcfce7"/><text x="258" y="1024" class="pn">G12</text>
  <line class="lead" x1="310" y1="1019" x2="430" y2="1019"/><text x="240" y="1024" class="fn" text-anchor="end">MPG B ← 74HCT14</text>
</g>

<g>
  <rect class="pinbox" x="780" y="898" width="60" height="22" fill="#fef3c7"/><text x="788" y="914" class="pn">G20</text>
  <line class="lead" x1="660" y1="909" x2="780" y2="909"/><text x="850" y="914" class="fn">I²C SCL — GT911 0x5D + MCP23017 0x20</text>

  <rect class="pinbox" x="780" y="930" width="60" height="22" fill="#fef3c7"/><text x="788" y="946" class="pn">G19</text>
  <line class="lead" x1="660" y1="941" x2="780" y2="941"/><text x="850" y="946" class="fn">I²C SDA — same bus, no address conflict</text>

  <rect class="pinbox" x="780" y="976" width="60" height="22" fill="#fff"/><text x="788" y="992" class="pn">free</text>
  <line class="lead" x1="660" y1="987" x2="780" y2="987"/><text x="850" y="992" class="fn">G10 · G13 · G00</text>
  <text x="850" y="1008" class="tiny">Freed by moving rough/fine and cycle start to the expander. Avoid G00 for a panel</text>
  <text x="850" y="1022" class="tiny">button — it is a boot strap and a leaning elbow at power-up prevents boot.</text>

  <rect class="pinbox" x="780" y="1032" width="60" height="22" fill="#e5e7eb"/><text x="786" y="1048" class="pn">n/a</text>
  <line class="lead" x1="660" y1="1043" x2="780" y2="1043"/><text x="850" y="1048" class="fn">RGB bus 1, 3–9, 14, 15, 16, 21, 39–42, 45–48 · BL 2 · GT911 RST 38 · PSRAM 33–37 · console 43/44 · TF card sacrificed</text>
</g>

</svg>
