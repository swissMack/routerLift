<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1035" width="1500" height="1035" font-family="Helvetica, Arial, sans-serif">
<style>
  .bg{fill:#fbfbf9}
  .box{fill:#fff;stroke:#333;stroke-width:1.8;rx:8}
  .hdr{font-size:15px;font-weight:700;fill:#111}
  .ttl{font-size:20px;font-weight:700;fill:#111}
  .sub{font-size:11px;fill:#666}
  .it{font-size:12px;fill:#222}
  .tiny{font-size:10.5px;fill:#777}
  .note{font-size:11px;fill:#444}
  .warn{font-size:11.5px;fill:#b3261e;font-weight:700}
  .ok{font-size:11.5px;fill:#166534;font-weight:700}
  .arr{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#a)}
  .arr2{stroke:#4b5563;stroke-width:1.6;fill:none;marker-end:url(#g)}
  .mains{stroke:#111;stroke-width:3;fill:none;marker-end:url(#k)}
  .zone{fill:#f0f4f8;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:7 5;rx:10}
  .zone2{fill:#fef6f0;stroke:#d08770;stroke-width:1.4;stroke-dasharray:7 5;rx:10}
  .lbl{font-size:11px;fill:#475569;font-family:ui-monospace,Menlo,monospace}
</style>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4b5563"/></marker>
  <marker id="k" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#111"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1500" height="1035"/>
<text x="40" y="40" class="ttl">routerLift — Architecture, Rev H</text>
<text x="40" y="60" class="sub">Split architecture. The HMI proposes; FluidNC disposes. Every safety-relevant decision sits below the link.</text>

<!-- ================= OPERATOR ================= -->
<rect class="box" x="40" y="100" width="230" height="330"/>
<text x="56" y="124" class="hdr">OPERATOR</text>
<text x="56" y="152" class="it">MPG handwheel — ZS80</text>
<text x="66" y="168" class="tiny">100 PPR · rough/fine scale</text>
<text x="56" y="192" class="it">6 panel buttons</text>
<text x="66" y="208" class="tiny">short + long press = 12 fns</text>
<text x="56" y="232" class="it">4.3" touchscreen</text>
<text x="66" y="248" class="tiny">second-level config only</text>
<text x="56" y="272" class="it">Foot switch</text>
<text x="66" y="288" class="tiny">hold to plunge, release to retract</text>
<text x="56" y="312" class="it">Touch-off probe</text>
<text x="56" y="344" class="warn">E-STOP</text>
<text x="56" y="360" class="tiny">mains mushroom — bypasses everything</text>
<text x="56" y="396" class="note">Anything used while the router runs</text>
<text x="56" y="412" class="note">is physical, never touch (ENV-01).</text>

<!-- ================= HMI ZONE ================= -->
<rect class="zone" x="310" y="90" width="510" height="350"/>
<text x="326" y="112" class="lbl">NO MOTION AUTHORITY — ELE-11</text>

<rect class="box" x="330" y="126" width="470" height="296"/>
<text x="346" y="150" class="hdr">HMI — ESP32-S3</text>
<text x="346" y="166" class="sub">ESP32-4827S043 · LVGL · our firmware</text>

<text x="346" y="196" class="it">Wheel</text><text x="440" y="196" class="tiny">PCNT quadrature → jog commands</text>
<text x="346" y="218" class="it">Buttons</text><text x="440" y="218" class="tiny">MCP23017 @ 0x20, polled 20 Hz</text>
<text x="346" y="240" class="it">Cycles</text><text x="440" y="240" class="tiny">scribe/rough/finish, dovetail, keyhole, bit-change</text>
<text x="346" y="262" class="it">Zero</text><text x="440" y="262" class="tiny">Z0 validity tracking (FW-09)</text>
<text x="346" y="284" class="it">Store</text><text x="440" y="284" class="tiny">presets + calibration in NVS</text>
<text x="346" y="306" class="it">Ui</text><text x="440" y="306" class="tiny">LVGL screens, status strip</text>
<text x="346" y="328" class="it">Link</text><text x="440" y="328" class="tiny">GRBL sender — the single chokepoint</text>

<text x="346" y="362" class="note" font-weight="700">Decides WHAT should happen.</text>
<text x="346" y="380" class="note">Knows depth, passes, presets, Z0 validity.</text>
<text x="346" y="398" class="warn">A bug here can give a wrong depth —</text>
<text x="346" y="414" class="warn">never an unsafe move.</text>

<line class="arr" x1="270" y1="200" x2="326" y2="200"/>
<line class="arr" x1="270" y1="240" x2="326" y2="240"/>

<!-- ================= LINK ================= -->
<line class="arr" x1="820" y1="250" x2="900" y2="250"/>
<line class="arr" x1="900" y1="290" x2="820" y2="290"/>
<text x="860" y="222" class="lbl" text-anchor="middle">UART</text>
<text x="860" y="236" class="tiny" text-anchor="middle">115200</text>
<text x="860" y="316" class="tiny" text-anchor="middle">status</text>
<text x="860" y="330" class="tiny" text-anchor="middle">~10 Hz</text>

<!-- ================= FLUIDNC ZONE ================= -->
<rect class="zone2" x="900" y="90" width="560" height="350"/>
<text x="916" y="112" class="lbl">SAFETY AUTHORITY LIVES HERE</text>

<rect class="box" x="920" y="126" width="520" height="296"/>
<text x="936" y="150" class="hdr">MOTION — ESP32 running FluidNC</text>
<text x="936" y="166" class="sub">stock binary · config.yaml only · no code of ours</text>

<text x="936" y="196" class="it">Step generation</text><text x="1090" y="196" class="tiny">trapezoidal accel, 800 steps/mm*</text>
<text x="936" y="218" class="it">Homing</text><text x="1090" y="218" class="tiny">two-stage seek + pull-off (MOT-06)</text>
<text x="936" y="240" class="it">Hard limits</text><text x="1090" y="240" class="tiny">bottom + top, in the ISR</text>
<text x="936" y="262" class="it">Soft limits</text><text x="1090" y="262" class="tiny">commissioning-only, checked pre-move</text>
<text x="936" y="284" class="it">Probe</text><text x="1090" y="284" class="tiny">G38.2 two-touch</text>
<text x="936" y="306" class="it">Spindle</text><text x="1090" y="306" class="tiny">relay_spindle → router contactor</text>
<text x="936" y="328" class="it">Control pins</text><text x="1090" y="328" class="tiny">STOP → feed_hold · FOOT → macro0</text>

<text x="936" y="362" class="note" font-weight="700">Decides whether it MAY happen.</text>
<text x="936" y="380" class="note">Rejects any move outside the envelope,</text>
<text x="936" y="396" class="note">regardless of what the HMI asked for.</text>
<text x="936" y="414" class="ok">Works standalone if the HMI is dead.</text>

<!-- ================= HARDWARE ================= -->
<rect class="box" x="920" y="480" width="520" height="250"/>
<text x="936" y="504" class="hdr">MACHINE HARDWARE</text>
<text x="936" y="532" class="it">TB6600 → NEMA 23 → lead screw → carriage</text>
<text x="936" y="556" class="it">Bottom switch</text><text x="1120" y="556" class="tiny">home reference + negative limit</text>
<text x="936" y="578" class="it">Top switch</text><text x="1120" y="578" class="tiny">positive limit, bounds bit-change</text>
<text x="936" y="600" class="it">Probe plate</text><text x="1120" y="600" class="tiny">Z0 reference — sets cut depth</text>
<text x="936" y="622" class="it">Contactor</text><text x="1120" y="622" class="tiny">router mains</text>
<text x="936" y="650" class="warn">DEV-01: no stall detection.</text>
<text x="936" y="666" class="note">Nothing discovers lost steps except the bottom switch,</text>
<text x="936" y="682" class="note">so the limits are primary protection, not a backstop.</text>
<text x="936" y="706" class="tiny">GPIO 35 reserved as DRIVER_ALARM — closes DEV-01 as a config edit.</text>

<line class="arr" x1="1180" y1="440" x2="1180" y2="474"/>
<line class="arr2" x1="1230" y1="474" x2="1230" y2="440"/>
<text x="1246" y="462" class="tiny">limits, probe, alarm</text>

<!-- ================= E-STOP CHAIN ================= -->
<rect class="box" x="40" y="480" width="820" height="250"/>
<text x="56" y="504" class="hdr">E-STOP CHAIN — HARDWARE ONLY</text>
<text x="56" y="520" class="sub">SAF-01 · no GPIO, no firmware, no software path of any kind</text>

<rect x="60" y="548" width="120" height="44" fill="#fff" stroke="#111" stroke-width="1.4" rx="4"/>
<text x="72" y="576" class="it">Mains L</text>
<line class="mains" x1="180" y1="570" x2="240" y2="570"/>
<rect x="240" y="548" width="120" height="44" fill="#fff" stroke="#b3261e" stroke-width="2" rx="4"/>
<text x="256" y="570" class="warn">E-STOP</text><text x="256" y="586" class="tiny">NC latching</text>
<line class="mains" x1="360" y1="570" x2="420" y2="570"/>
<rect x="420" y="548" width="110" height="44" fill="#fff" stroke="#111" stroke-width="1.4" rx="4"/>
<text x="436" y="576" class="it">Fuse</text>
<line class="mains" x1="530" y1="570" x2="600" y2="570"/>
<rect x="600" y="522" width="130" height="40" fill="#fff" stroke="#111" stroke-width="1.4" rx="4"/>
<text x="614" y="547" class="it">PSU 24–36 V</text>
<rect x="600" y="580" width="130" height="40" fill="#fff" stroke="#111" stroke-width="1.4" rx="4"/>
<text x="614" y="605" class="it">Contactor</text>
<line class="mains" x1="600" y1="570" x2="600" y2="542"/>
<line class="mains" x1="600" y1="570" x2="600" y2="600"/>

<text x="56" y="648" class="note">One button removes power from the lift <tspan font-weight="700">and</tspan> the router together.</text>
<text x="56" y="668" class="note">Killing the PSU kills the controller, so machine position is lost — FLT-04, no auto-resume.</text>
<text x="56" y="684" class="note">Recovery is re-home plus re-touch-off (FLT-06). That is intentional, not a shortcoming.</text>
<text x="56" y="710" class="warn">Neither ESP32 can see it, override it, or fail to honour it.</text>

<!-- ================= WHY SPLIT ================= -->
<rect class="box" x="40" y="770" width="1400" height="228"/>
<text x="56" y="794" class="hdr">WHY TWO CONTROLLERS</text>

<text x="56" y="822" class="note" font-weight="700">Forced:</text>
<text x="130" y="822" class="note">FluidNC does not run on the ESP32-S3, and the S3's RGB panel consumes 20 GPIOs — it cannot carry the machine's pin budget.</text>
<text x="56" y="846" class="note" font-weight="700">Gained:</text>
<text x="130" y="846" class="note">Motion stays a stock, proven binary configured by one YAML file. Homing, limits, probing and jogging are not ours to get wrong.</text>
<text x="56" y="870" class="note" font-weight="700">Paid:</text>
<text x="130" y="870" class="note">Handwheel latency — the wheel now reaches the step generator through a UART hop. And a link-loss failure mode that a single-board design cannot have.</text>

<text x="56" y="898" class="note" font-weight="700">Over the link:</text>
<text x="180" y="898" class="note">HMI → <tspan font-family="ui-monospace,Menlo,monospace">$J=</tspan> jog · <tspan font-family="ui-monospace,Menlo,monospace">$H</tspan> home · <tspan font-family="ui-monospace,Menlo,monospace">G38.2</tspan> probe · <tspan font-family="ui-monospace,Menlo,monospace">M3/M5</tspan> router · <tspan font-family="ui-monospace,Menlo,monospace">! ~ 0x18 0x85</tspan> immediate.  FluidNC → <tspan font-family="ui-monospace,Menlo,monospace">&lt;Idle|MPos:…|FS:…&gt;</tspan> status at ~10 Hz.  <tspan fill="#b3261e" font-weight="700">Link loss → feed hold, Z0 invalidated.</tspan></text>
<text x="56" y="922" class="note" font-weight="700">The boundary that matters:</text>
<text x="56" y="944" class="note">The HMI can ask for a bad depth. It cannot ask for an unsafe move, because soft limits, hard limits, homing and probing are all enforced on the</text>
<text x="56" y="960" class="note">far side of the link, and the E-stop is on neither side. STOP is wired to FluidNC's own <tspan font-family="ui-monospace,Menlo,monospace">feed_hold_pin</tspan> for the same reason — it must work when the HMI does not.</text>
<text x="56" y="982" class="tiny">* 800 steps/mm is provisional — it follows from an assumed 2 mm screw lead and must be measured on the actual lift body.</text>

</svg>
