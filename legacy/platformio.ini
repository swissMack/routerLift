; ============================================================================
; Router Lift V1 - PlatformIO Configuration
; Target: ESP32 DevKit V1 (any ESP32 with PSRAM optional)
; ============================================================================

[env:esp32dev]
; Pinned: espressif32 7.x ships ESP-IDF 5.x which removes the legacy RMT
; macros that FastAccelStepper 0.30.x relies on. 6.6.0 is the last release
; with legacy RMT intact (Arduino core 2.0.14 / ESP-IDF 4.4.7).
platform = espressif32 @ 6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- Library dependencies ---
lib_deps =
    gin66/FastAccelStepper @ ^0.30.13
    madhephaestus/ESP32Encoder @ ^0.11.7
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; --- Build flags ---
; TFT_eSPI is configured via build flags so we don't have to edit User_Setup.h
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; --- File system & partitioning ---
board_build.partitions = default.csv
