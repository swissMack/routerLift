; routerLift — RevG split architecture
;
; Motion control is stock FluidNC on a standard ESP32; it is configured by
; firmware/config.yaml and has no source here.
;
; This project builds the HMI only: the ESP32-S3 touch panel (LVGL) that acts
; as the operator interface and GRBL sender.
;
; legacy/ holds the retired pre-RevG single-ESP32 firmware. It has no
; environment here and is deliberately not built. See legacy/README.md.

[env:hmi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3-WROOM-1-N4R8: 4 MB flash (QSPI), 8 MB PSRAM (octal)
board_build.arduino.memory_type = qio_opi

src_dir = hmi/src
include_dir = hmi/include

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.9
    lvgl/lvgl @ ^8.4.0
