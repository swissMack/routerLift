; routerLift — RevH split architecture
;
; Motion control is stock FluidNC on a classic ESP32; it is configured by
; firmware/config.yaml and has no source here.
;
; This project builds the HMI only: the ESP32-S3 touch panel that acts as the
; operator interface and GRBL sender.
;
; legacy/ holds the retired pre-RevG single-ESP32 firmware. It has no
; environment here and is deliberately not built. See legacy/README.md.

[platformio]
src_dir = hmi/src
include_dir = hmi/include

[env:hmi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3-WROOM-1-N4R8 on the ESP32-4827S043 board:
; 4 MB flash (QSPI) + 8 MB PSRAM (OCTAL). The stock board definition assumes
; 8 MB flash and no PSRAM, so both are overridden here. qio_opi is what selects
; octal PSRAM - with the wrong value the panel driver has no framebuffer.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; LVGL finds hmi/include/lv_conf.h through these two. Without them it
    ; falls back to looking for ../../lv_conf.h next to the library and the
    ; whole of LVGL fails to compile.
    -DLV_CONF_INCLUDE_SIMPLE
    -I hmi/include

lib_deps =
    madhephaestus/ESP32Encoder @ ^0.11.7
    moononournation/GFX Library for Arduino @ ^1.4.9
    lvgl/lvgl @ ^8.4.0
    tamctec/TAMC_GT911 @ ^1.0.2
